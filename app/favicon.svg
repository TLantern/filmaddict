<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Black background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Horizontal strip (light beige/peach) -->
  <rect x="4" y="10" width="24" height="8" fill="#f5deb3" stroke="#000000" stroke-width="0.5" rx="1"/>
  
  <!-- Curled corner effect (top-right) -->
  <path d="M 26 10 Q 28 10 28 12 L 28 10 Z" fill="#f5deb3" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Vertical dashed cutting line -->
  <line x1="16" y1="10" x2="16" y2="18" stroke="#000000" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>
  
  <!-- Scissors (diagonal, cutting through strip) -->
  <g transform="rotate(25 16 14)">
    <!-- Scissors blade 1 (left) -->
    <path d="M 10 8 L 16 14 L 15 15 L 9 9 Z" fill="#d3d3d3" stroke="#000000" stroke-width="0.8"/>
    <!-- Scissors blade 2 (right) -->
    <path d="M 22 20 L 16 14 L 17 13 L 23 19 Z" fill="#d3d3d3" stroke="#000000" stroke-width="0.8"/>
    <!-- Scissors pivot -->
    <circle cx="16" cy="14" r="1.2" fill="#d3d3d3" stroke="#000000" stroke-width="0.5"/>
    <!-- Scissors handles -->
    <ellipse cx="8" cy="6" rx="2.5" ry="2" fill="#d3d3d3" stroke="#000000" stroke-width="0.8"/>
    <ellipse cx="24" cy="22" rx="2.5" ry="2" fill="#d3d3d3" stroke="#000000" stroke-width="0.8"/>
  </g>
</svg>

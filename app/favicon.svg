<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Black background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Film strip (diagonal orientation) -->
  <g transform="rotate(-15 16 16)">
    <!-- Film strip body with blue gradient -->
    <defs>
      <linearGradient id="filmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <!-- Film strip rectangle -->
    <rect x="6" y="10" width="20" height="12" fill="url(#filmGradient)" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Film perforations top -->
    <rect x="8" y="10" width="2" height="1.5" fill="#000000"/>
    <rect x="12" y="10" width="2" height="1.5" fill="#000000"/>
    <rect x="16" y="10" width="2" height="1.5" fill="#000000"/>
    <rect x="20" y="10" width="2" height="1.5" fill="#000000"/>
    
    <!-- Film perforations bottom -->
    <rect x="8" y="20.5" width="2" height="1.5" fill="#000000"/>
    <rect x="12" y="20.5" width="2" height="1.5" fill="#000000"/>
    <rect x="16" y="20.5" width="2" height="1.5" fill="#000000"/>
    <rect x="20" y="20.5" width="2" height="1.5" fill="#000000"/>
  </g>
  
  <!-- Scissors cutting through -->
  <g transform="rotate(-15 16 16)">
    <!-- Scissors blade 1 (upper left) -->
    <path d="M 8 8 L 16 16 L 14 18 L 6 10 Z" fill="#000000" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Scissors blade 2 (lower right) -->
    <path d="M 24 24 L 16 16 L 18 14 L 26 22 Z" fill="#000000" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Scissors pivot -->
    <circle cx="16" cy="16" r="1.5" fill="#ffffff" stroke="#000000" stroke-width="0.3"/>
    <!-- Scissors handles -->
    <ellipse cx="10" cy="6" rx="2" ry="1.5" fill="#000000" stroke="#ffffff" stroke-width="0.5"/>
    <ellipse cx="22" cy="26" rx="2" ry="1.5" fill="#000000" stroke="#ffffff" stroke-width="0.5"/>
  </g>
</svg>

